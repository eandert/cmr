name: tests

# Runs the CMR unit-test suite. No GPU/torch needed — the suite is CPU-only,
# so this runs on standard GitHub-hosted runners. Data-dependent and slow tests
# auto-skip in a clean checkout (data/ and results/ artifacts are gitignored;
# slow tests are opt-in via --runslow).

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Project baseline is Python 3.10 (the proven venv). Add "3.12" here
        # once the pinned deps are validated against it.
        python-version: ["3.10"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest tests/ -q -ra
